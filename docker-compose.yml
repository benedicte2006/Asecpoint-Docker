services:
  # Base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: asecna-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: asecna_db
      MYSQL_USER: asecna_user
      MYSQL_PASSWORD: asecna_pass
      MYSQL_ROOT_PASSWORD: root_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - asecna-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "asecna_user", "-pasecna_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend Spring Boot (API REST + STOMP WebSockets)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: asecna-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/asecna_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: asecna_user
      SPRING_DATASOURCE_PASSWORD: asecna_pass
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-asecnaSuperSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong!}
      APP_QR_SESSION_TTL_SECONDS: ${QR_TTL_SECONDS:-90}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - asecna-net

  # Frontend Angular
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: asecna-frontend
    restart: unless-stopped
    networks:
      - asecna-net

  # Reverse-Proxy Nginx (Port 80 / 443)
  reverse-proxy:
    image: nginx:1.25-alpine
    container_name: asecna-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - asecna-net

volumes:
  mysql_data:
    driver: local

networks:
  asecna-net:
    driver: bridge
